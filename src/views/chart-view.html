<div id="root">
  <div id="head">
    <span id="title">Waiting for data</span>
    <div id="actions">
      <span id="count"></span>
      <span id="exportStatus" role="status" aria-live="polite"></span>
      <button id="tableBtn" class="btn" type="button" aria-expanded="false" disabled>Table</button>
      <button id="copyBtn" class="btn" type="button" disabled>Copy image</button>
    </div>
  </div>
  <div id="canvas"></div>
  <!-- The chart's table twin. Deliberately OUTSIDE #canvas: the headless PNG
       render screenshots #canvas alone, so opening the table never changes
       the exported image. -->
  <div id="tableWrap" hidden></div>
</div>

<style>
  :root { color-scheme: light dark; }
  #root {
    font-family: ui-sans-serif, system-ui, sans-serif;
    color: var(--mcp-text, #1d1d1b);
  }
  /* flex-wrap + min-width:0 on the title keeps a long title from ever
     overlapping the action buttons — it wraps to its own line instead. */
  #head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 12px;
    margin-bottom: 10px;
  }
  #title {
    font-size: 15px;
    font-weight: 500;
    min-width: 0;
    flex: 1 1 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #actions {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    flex: 0 0 auto;
  }
  #count {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    opacity: 0.55;
    white-space: nowrap;
  }
  #exportStatus {
    font-size: 12px;
    opacity: 0.7;
    white-space: nowrap;
  }
  .btn {
    appearance: none;
    border: 1px solid currentColor;
    border-color: rgba(128, 128, 128, 0.35);
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 12px;
    line-height: 1.4;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0.75;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { opacity: 1; border-color: currentColor; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.3; cursor: default; }
  /* canvas sits in normal flow below #head, never underneath it, so the
     chart(s) can never overlap the title/actions row. */
  /* Single-chart mode (the default #canvas.single) stays fully responsive —
     100% width, fixed height — matching the original single-canvas layout.
     Multi-chart mode switches to a fixed-cell grid (sized in JS to match
     chartCanvasSize on the server) so each cell has consistent, predictable
     dimensions regardless of viewport width. */
  #canvas.single { width: 100%; }
  #canvas.grid {
    display: grid;
    gap: 16px;
  }
  .chart-cell {
    display: flex;
    flex-direction: column;
    min-width: 0;
    border: 1px solid rgba(128, 128, 128, 0.2);
    border-radius: 8px;
    overflow: hidden;
  }
  .chart-cell-title {
    padding: 6px 10px 0;
    font-size: 12px;
    font-weight: 500;
    opacity: 0.75;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chart-cell-mount { width: 480px; height: 300px; }
  /* Single-chart mode reuses the one cell at full width/height with no
     border/mini-title, matching the original single-canvas layout exactly. */
  #canvas.single .chart-cell { border: none; }
  #canvas.single .chart-cell-title { display: none; }
  #canvas.single .chart-cell-mount { width: 100%; height: 400px; }
  /* Table twin — the WCAG-clean equivalent of the plot. Scrolls inside its
     own box so a wide table never makes the whole view scroll sideways. */
  #tableWrap { margin-top: 14px; overflow-x: auto; }
  #tableWrap table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  #tableWrap caption {
    text-align: left;
    font-size: 12px;
    font-weight: 500;
    opacity: 0.75;
    padding: 10px 0 6px;
  }
  #tableWrap th,
  #tableWrap td {
    text-align: right;
    padding: 4px 10px;
    white-space: nowrap;
    border-bottom: 1px solid rgba(128, 128, 128, 0.2);
  }
  #tableWrap th:first-child,
  #tableWrap td:first-child { text-align: left; }
  #tableWrap thead th { font-weight: 500; opacity: 0.7; }
  @media (prefers-color-scheme: dark) {
    #root { color: var(--mcp-text, #e8e6e1); }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>

<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1/+esm";

  const titleEl = document.getElementById("title");
  const countEl = document.getElementById("count");
  const exportStatusEl = document.getElementById("exportStatus");
  const copyBtn = document.getElementById("copyBtn");
  const tableBtn = document.getElementById("tableBtn");
  const tableWrap = document.getElementById("tableWrap");
  const canvasRoot = document.getElementById("canvas");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;

  /**
   * Validated categorical palette — eight fixed hues, each mode stepped for
   * its own surface (not an automatic flip of the light values). Slots are
   * assigned in declaration order and NEVER cycled: a ninth generated hue is
   * indistinguishable from an earlier slot under colour-vision deficiency, so
   * the tail goes muted grey and leans on the legend and direct labels
   * instead of pretending to be a distinct series colour.
   */
  const PALETTE_LIGHT = [
    "#2a78d6", "#eb6834", "#1baf7a", "#eda100",
    "#e87ba4", "#008300", "#4a3aa7", "#e34948",
  ];
  const PALETTE_DARK = [
    "#3987e5", "#d95926", "#199e70", "#c98500",
    "#d55181", "#008300", "#9085e9", "#e66767",
  ];

  /** Chart chrome. Grid/axis/label ink is recessive — one shade off the surface. */
  const INK = dark
    ? { surface: "#1a1a19", primary: "#ffffff", secondary: "#c3c2b7", muted: "#898781", grid: "#2c2c2a", axis: "#383835" }
    : { surface: "#fcfcfb", primary: "#0b0b0b", secondary: "#52514e", muted: "#898781", grid: "#e1e0d9", axis: "#c3c2b7" };

  const PALETTE = dark ? PALETTE_DARK : PALETTE_LIGHT;
  const seriesColor = (i) => PALETTE[i] ?? INK.muted;

  const escapeHTML = (s) =>
    String(s).replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );

  const trimZeros = (n, digits) => Number(n.toFixed(digits)).toString();

  /** Axis ticks and end labels: compact past 10k so ticks never collide. */
  function formatCompact(v) {
    if (typeof v !== "number" || !Number.isFinite(v)) return String(v);
    const abs = Math.abs(v);
    if (abs >= 1e9) return `${trimZeros(v / 1e9, 1)}B`;
    if (abs >= 1e6) return `${trimZeros(v / 1e6, 1)}M`;
    if (abs >= 1e4) return `${trimZeros(v / 1e3, 1)}k`;
    if (abs >= 1) return trimZeros(v, 2);
    return trimZeros(v, 4);
  }

  /** Tooltips and the table: full precision, digit-grouped. */
  function formatFull(v) {
    if (typeof v !== "number" || !Number.isFinite(v)) return String(v);
    return v.toLocaleString(undefined, { maximumFractionDigits: 6 });
  }

  /**
   * Years are integers that must never be grouped ("1,980") or compacted
   * ("2k") — which is exactly what a generic number formatter does to them.
   */
  function looksLikeYears(values) {
    return (
      values.length > 0 &&
      values.every((v) => Number.isInteger(v) && v >= 1000 && v <= 9999)
    );
  }

  /** Everything the axes and formatters need to know about a chart's x values. */
  function axisInfo(spec) {
    const xs = spec.series.flatMap((s) => s.points.map((p) => p.x));
    const categorical = xs.some((x) => typeof x === "string");
    const nums = xs.filter((x) => typeof x === "number");
    const years = !categorical && looksLikeYears(nums);
    return {
      categorical,
      categories: categorical ? [...new Set(xs.map(String))] : [],
      years,
      integerX: !categorical && nums.length > 0 && nums.every(Number.isInteger),
      formatX: categorical
        ? (v) => String(v)
        : years
          ? (v) => String(Math.round(v))
          : formatCompact,
    };
  }

  /**
   * Partial arguments arrive as incompletely-parsed JSON, so every field is
   * treated as optional and possibly half-written. Anything malformed is
   * dropped rather than thrown — the next partial will supersede it.
   */
  function cleanChart(args) {
    if (!args || typeof args !== "object") return null;
    const series = Array.isArray(args.series) ? args.series : [];
    let usable = series
      .filter((s) => s && Array.isArray(s.points))
      .map((s) => ({
        name: typeof s.name === "string" ? s.name : "series",
        points: s.points.filter(
          (p) => p && p.x !== undefined && typeof p.y === "number",
        ),
      }));

    // A model that built its series from a dict emits points in whatever order
    // it happened to iterate. ECharts joins a line in ARRAY order, not x
    // order, so unsorted input draws as spaghetti across the whole plot and
    // strands the end label on a mid-chart point. Sort numeric domains here so
    // the chart and the table agree. Category axes keep declaration order —
    // there the sequence IS the axis, and re-ordering it would be wrong.
    const anyCategorical = usable.some((s) =>
      s.points.some((p) => typeof p.x === "string"),
    );
    if (!anyCategorical) {
      usable = usable.map((s) => ({
        name: s.name,
        points: [...s.points].sort((a, b) => a.x - b.x),
      }));
    }

    return {
      kind: ["line", "bar", "scatter", "area"].includes(args.kind)
        ? args.kind
        : "line",
      title: typeof args.title === "string" ? args.title : "",
      xLabel: typeof args.xLabel === "string" ? args.xLabel : "",
      yLabel: typeof args.yLabel === "string" ? args.yLabel : "",
      series: usable,
    };
  }

  function clean(args) {
    const raw = args && Array.isArray(args.charts) ? args.charts : [];
    return raw.map(cleanChart).filter((c) => c !== null);
  }

  function toEchartsSeries(spec, endLabels) {
    const type = spec.kind === "area" ? "line" : spec.kind;
    const isLine = type === "line";
    return spec.series.map((s, i) => {
      const color = seriesColor(i);
      return {
        name: s.name,
        type,
        data: s.points.map((p) => [p.x, p.y]),
        // No smoothing. A spline invents curvature between measured points —
        // it reads as data the series does not contain.
        smooth: false,
        // A marker on every point is noise past a few dozen: the line already
        // carries the shape and the tooltip carries the values.
        showSymbol: isLine ? s.points.length <= 30 : true,
        symbolSize: spec.kind === "scatter" ? 9 : 8,
        itemStyle: {
          color,
          // A 2px surface ring keeps overlapping scatter markers countable —
          // that is a spacer, not a border drawn to separate marks.
          borderColor: INK.surface,
          borderWidth: spec.kind === "scatter" ? 2 : 0,
          borderRadius: type === "bar" ? [4, 4, 0, 0] : undefined,
        },
        lineStyle: isLine ? { width: 2, color } : undefined,
        areaStyle: spec.kind === "area" ? { color, opacity: 0.14 } : undefined,
        emphasis: { focus: "series" },
        // Direct label on the final point only — never a number on every
        // point. `show: false` rather than undefined so a chart that stops
        // qualifying for end labels actually loses them on the next merge.
        endLabel: {
          show: isLine && endLabels,
          distance: 6,
          color: INK.secondary,
          fontSize: 11,
          formatter: (p) => formatCompact(p.value[1]),
        },
        barMaxWidth: 42,
        barGap: "12%",
      };
    });
  }

  function tooltipHTML(params, ax) {
    const rows = Array.isArray(params) ? params : [params];
    if (rows.length === 0) return "";
    const first = rows[0];
    const head = Array.isArray(first.value) ? ax.formatX(first.value[0]) : first.name;
    const body = rows
      .map(
        (p) =>
          `<div style="display:flex;gap:8px;align-items:baseline;">${p.marker}` +
          `<span style="flex:1 1 auto;">${escapeHTML(p.seriesName)}</span>` +
          `<b style="font-variant-numeric:tabular-nums;">${formatFull(Array.isArray(p.value) ? p.value[1] : p.value)}</b></div>`,
      )
      .join("");
    return `<div style="opacity:.7;margin-bottom:4px;">${escapeHTML(String(head))}</div>${body}`;
  }

  function gridColumns(n) {
    return n <= 4 ? 2 : 3;
  }

  /**
   * One ECharts instance per chart cell. Cells are created/torn down as the
   * charts array grows/shrinks between partials — this only churns instances
   * when the *count* changes, not on every redraw.
   */
  let cells = []; // { cell, titleEl, inst, seriesCount, kind }

  function ensureCells(n) {
    if (n === cells.length) return;

    while (cells.length < n) {
      const cellEl = document.createElement("div");
      cellEl.className = "chart-cell";
      const cellTitleEl = document.createElement("div");
      cellTitleEl.className = "chart-cell-title";
      const mountEl = document.createElement("div");
      mountEl.className = "chart-cell-mount";
      cellEl.append(cellTitleEl, mountEl);
      canvasRoot.appendChild(cellEl);
      // No built-in theme: the "dark" theme ships its own palette and paints
      // an opaque navy background that fights whatever surface the host has.
      // Colours come from the validated tokens above instead.
      const inst = echarts.init(mountEl, null, { renderer: "canvas" });
      inst.getDom().style.background = "transparent";
      cells.push({ cell: cellEl, titleEl: cellTitleEl, inst, seriesCount: 0, kind: null });
    }
    while (cells.length > n) {
      const { cell, inst } = cells.pop();
      inst.dispose();
      cell.remove();
    }

    const isSingle = n <= 1;
    canvasRoot.classList.toggle("single", isSingle);
    canvasRoot.classList.toggle("grid", !isSingle);
    canvasRoot.style.gridTemplateColumns = isSingle
      ? ""
      : `repeat(${gridColumns(n)}, 480px)`;
    // Mode switch (single <-> grid) changes each mount's CSS size instantly;
    // ECharts needs an explicit nudge to pick up the new container size.
    // Synchronous (not rAF) so the headless one-shot render path — which
    // draws once and screenshots shortly after, with no further frames in
    // between — always reflects the right size.
    cells.forEach(({ inst }) => inst.resize());
  }

  function drawChart(spec, cellState, { showCellTitle, endLabels }) {
    const { inst, titleEl: cellTitleEl } = cellState;
    if (showCellTitle) cellTitleEl.textContent = spec.title || "Chart";

    // setOption merges by index — that merge is what makes streaming partials
    // append instead of redraw, but it cannot express "this chart now has
    // fewer series" or "it changed type", so those two cases reset first.
    if (
      spec.series.length < cellState.seriesCount ||
      (cellState.kind !== null && cellState.kind !== spec.kind)
    ) {
      inst.clear();
    }
    cellState.seriesCount = spec.series.length;
    cellState.kind = spec.kind;

    const ax = axisInfo(spec);
    const multi = spec.series.length > 1;
    // Long or numerous category names don't fit horizontally, and hideOverlap
    // answers that by dropping labels — which on a category axis means bars
    // you cannot identify at all. Rotating keeps every name attached to its
    // bar; truncation caps how much space the longest one can eat.
    //
    // containLabel does NOT reserve horizontal room for a rotated label's
    // overhang, so the leftmost one runs off the canvas unless grid.left
    // covers it, and the axis name has to clear the whole rotated band rather
    // than one line of text. Both fall out of the triangle, so derive them
    // instead of hand-tuning two numbers that must agree.
    // Rotate only when the labels genuinely don't fit: a handful of short
    // names in a wide chart reads better flat. The instance already knows its
    // own width, so compare the widest name against the room one category
    // actually gets instead of guessing from a name-length threshold.
    const CHAR_PX = 6.2; // 11px system sans, approximate advance width
    const perCategory =
      (inst.getWidth() - 80) / Math.max(ax.categories.length, 1);
    const widestCategory =
      ax.categories.reduce((n, c) => Math.max(n, String(c).length), 0) * CHAR_PX;
    const longCategories = ax.categorical && widestCategory > perCategory;
    const LABEL_ROTATE = 45;
    const LABEL_WIDTH = 96; // truncation cap, px
    const rad = (LABEL_ROTATE * Math.PI) / 180;
    const labelOverhang = Math.ceil(LABEL_WIDTH * Math.cos(rad));
    const labelBand = Math.ceil(LABEL_WIDTH * Math.sin(rad));
    // Bars and filled areas encode magnitude by extent, so their baseline has
    // to be zero or the lengths lie. A line or scatter encodes position —
    // pinning it to zero just flattens the shape into a stripe.
    const zeroBaseline = spec.kind === "bar" || spec.kind === "area";

    inst.setOption({
      animationDuration: 320,
      animationDurationUpdate: 320,
      aria: { enabled: true },
      color: spec.series.map((_, i) => seriesColor(i)),
      textStyle: { fontFamily: "ui-sans-serif, system-ui, sans-serif" },
      grid: {
        // containLabel reserves room for tick LABELS only — an axis *name* is
        // laid out beyond that and gets clipped off the canvas unless the
        // corresponding side is padded here. Hence the per-side bumps.
        left: longCategories ? labelOverhang + 4 : 8,
        right: endLabels ? 56 : 16,
        top: (multi ? 34 : 12) + (spec.yLabel ? 18 : 0),
        bottom: spec.xLabel ? 28 : 6,
        containLabel: true,
      },
      tooltip: {
        trigger: spec.kind === "scatter" ? "item" : "axis",
        axisPointer: { type: "line", snap: true, lineStyle: { color: INK.axis, width: 1 } },
        backgroundColor: INK.surface,
        borderColor: INK.grid,
        borderWidth: 1,
        padding: [8, 10],
        textStyle: { color: INK.primary, fontSize: 12 },
        formatter: (params) => tooltipHTML(params, ax),
      },
      // A legend is always present for 2+ series so identity is never carried
      // by colour alone; one series needs none — the title names it.
      legend: multi
        ? {
            top: 0,
            left: "center",
            icon: "roundRect",
            itemWidth: 10,
            itemHeight: 10,
            itemGap: 14,
            textStyle: { color: INK.secondary, fontSize: 11 },
          }
        : { show: false },
      xAxis: {
        type: ax.categorical ? "category" : "value",
        name: spec.xLabel || "",
        nameLocation: "middle",
        nameGap: longCategories ? labelBand + 16 : 28,
        nameTextStyle: { color: INK.secondary, fontSize: 11 },
        // A value axis defaults to scale:false, which forces zero into the
        // range. On a 1974–2024 axis that stretches the plot to 0–2500 and
        // crushes every point into a sliver at the right edge. x is a
        // position, never a magnitude — always fit it to the data.
        scale: true,
        // With only `scale`, ECharts still rounds the ends out to the next
        // nice tick — a 1974–2024 series gets a 1970–2030 axis and gives up a
        // fifth of the plot to empty margin. A year domain pins to its real
        // extent instead (minInterval keeps those ticks whole). Other numeric
        // domains keep the rounding: there the round end IS the clean one,
        // and a pinned end just crowds a stray label against its neighbour.
        min: ax.years ? "dataMin" : undefined,
        max: ax.years ? "dataMax" : undefined,
        minInterval: ax.integerX ? 1 : 0,
        boundaryGap: ax.categorical ? spec.kind === "bar" : [0, 0],
        axisLine: { lineStyle: { color: INK.axis } },
        axisTick: { show: false },
        axisLabel: {
          color: INK.muted,
          fontSize: 11,
          hideOverlap: true,
          rotate: longCategories ? LABEL_ROTATE : 0,
          overflow: longCategories ? "truncate" : undefined,
          width: longCategories ? LABEL_WIDTH : undefined,
          formatter: ax.categorical ? undefined : ax.formatX,
        },
        splitLine: { show: false },
      },
      yAxis: {
        type: "value",
        scale: !zeroBaseline,
        name: spec.yLabel || "",
        // A horizontal caption above the axis, not a rotated centred name.
        // `nameGap` on a rotated name is measured from the axis line, so it
        // has to clear tick text whose width is unknown until after layout —
        // too small and the caption lands on top of the numbers, too large
        // and it falls off the canvas, and the gap that works for "40" is
        // wrong for "1.8M". Above the axis there is nothing to collide with,
        // and a long unit string stays horizontal and readable.
        nameLocation: "end",
        nameRotate: 0,
        nameGap: 12,
        nameTextStyle: { color: INK.secondary, fontSize: 11, align: "left" },
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: INK.muted, fontSize: 11, formatter: formatCompact },
        // Solid hairlines one shade off the surface — never dashed, which
        // reads as "threshold" when it is only a grid.
        splitLine: { show: true, lineStyle: { color: INK.grid, width: 1, type: "solid" } },
      },
      series: toEchartsSeries(spec, endLabels),
    });
  }

  /**
   * The table twin: every plotted value reachable as text — for screen
   * readers, for anyone who can't separate two hues, and for anyone who wants
   * the number rather than the shape. Tooltips enhance, they never gate.
   */
  function tableHTML(spec) {
    const ax = axisInfo(spec);
    const keys = [];
    const seen = new Set();
    for (const s of spec.series) {
      for (const p of s.points) {
        const k = String(p.x);
        if (!seen.has(k)) {
          seen.add(k);
          keys.push(p.x);
        }
      }
    }
    if (keys.every((k) => typeof k === "number")) keys.sort((a, b) => a - b);

    const lookups = spec.series.map((s) => {
      const m = new Map();
      for (const p of s.points) m.set(String(p.x), p.y);
      return m;
    });
    const labelX = (k) =>
      typeof k !== "number" ? String(k) : ax.years ? String(k) : formatFull(k);

    const head = `<tr><th scope="col">${escapeHTML(spec.xLabel || "x")}</th>${spec.series
      .map((s) => `<th scope="col">${escapeHTML(s.name)}</th>`)
      .join("")}</tr>`;
    const body = keys
      .map(
        (k) =>
          `<tr><th scope="row">${escapeHTML(labelX(k))}</th>${lookups
            .map((m) => {
              const v = m.get(String(k));
              return `<td>${v === undefined ? "—" : escapeHTML(formatFull(v))}</td>`;
            })
            .join("")}</tr>`,
      )
      .join("");

    const caption = `${escapeHTML(spec.title || "Chart")}${spec.yLabel ? ` — ${escapeHTML(spec.yLabel)}` : ""}`;
    return `<table><caption>${caption}</caption><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }

  /**
   * setOption merges by default, so re-issuing it with a longer data array
   * appends points and animates the transition. Nothing already drawn moves.
   */
  let tableOpen = false;
  let lastCharts = [];

  function renderTable(charts) {
    lastCharts = charts;
    tableBtn.disabled = charts.length === 0;
    if (tableOpen) tableWrap.innerHTML = charts.map(tableHTML).join("");
  }

  tableBtn.addEventListener("click", () => {
    tableOpen = !tableOpen;
    tableWrap.hidden = !tableOpen;
    tableBtn.setAttribute("aria-expanded", String(tableOpen));
    tableBtn.textContent = tableOpen ? "Hide table" : "Table";
    if (tableOpen) tableWrap.innerHTML = lastCharts.map(tableHTML).join("");
  });

  function draw(args) {
    const charts = clean(args);
    ensureCells(charts.length);

    const showCellTitles = charts.length > 1;
    let totalPoints = 0;
    charts.forEach((spec, i) => {
      totalPoints += spec.series.reduce((n, s) => n + s.points.length, 0);
      drawChart(spec, cells[i], {
        showCellTitle: showCellTitles,
        // End labels replace hunting the axis for the final value, but only
        // where there is room for them: one chart, a handful of lines.
        endLabels:
          charts.length === 1 &&
          spec.series.length <= 4 &&
          (spec.kind === "line" || spec.kind === "area"),
      });
    });
    renderTable(charts);

    titleEl.textContent =
      charts.length === 0
        ? "Waiting for data"
        : charts.length === 1
          ? charts[0].title || "Chart"
          : `${charts.length} charts`;
    countEl.textContent = totalPoints ? `${totalPoints} points` : "";
    copyBtn.disabled = totalPoints === 0;
  }

  // ── Copy as image ──────────────────────────────────────────────────────
  // Lets the rendered chart(s) be reused outside the chat — pasted straight
  // into Excel, Slides, docs, or a flow-diagram tool as a plain PNG. (The
  // tool result itself also ships a server-rendered PNG for headless
  // clients — this button is for a human looking at the live view.)
  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  async function chartsPNGDataURL() {
    if (cells.length === 0) return null;
    const bg = INK.surface;
    if (cells.length === 1) {
      return cells[0].inst.getDataURL({ type: "png", pixelRatio: 2, backgroundColor: bg });
    }
    // Composite every cell's own canvas onto one image, positioned to match
    // their actual on-screen grid layout.
    const rootRect = canvasRoot.getBoundingClientRect();
    const scale = 2;
    const composite = document.createElement("canvas");
    composite.width = Math.round(rootRect.width * scale);
    composite.height = Math.round(rootRect.height * scale);
    const ctx = composite.getContext("2d");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, composite.width, composite.height);
    for (const { cell, inst } of cells) {
      const cellRect = cell.getBoundingClientRect();
      const img = await loadImage(
        inst.getDataURL({ type: "png", pixelRatio: scale, backgroundColor: "transparent" }),
      );
      ctx.drawImage(
        img,
        Math.round((cellRect.left - rootRect.left) * scale),
        Math.round((cellRect.top - rootRect.top) * scale),
        Math.round(cellRect.width * scale),
        Math.round(cellRect.height * scale),
      );
    }
    return composite.toDataURL("image/png");
  }

  function dataUrlToBlob(dataUrl) {
    const [meta, base64] = dataUrl.split(",");
    const mime = /data:(.*?);base64/.exec(meta)?.[1] || "image/png";
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  let statusTimer = null;
  // Status text lives inline in the header next to the buttons (not a
  // floating toast over the chart), so it can never overlap the canvas.
  function flashExportStatus(msg, ms = 2200) {
    exportStatusEl.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => {
      exportStatusEl.textContent = "";
    }, ms);
  }

  copyBtn.addEventListener("click", async () => {
    if (!navigator.clipboard || typeof ClipboardItem === "undefined") {
      flashExportStatus("Copy unsupported in this host");
      return;
    }
    try {
      const dataUrl = await chartsPNGDataURL();
      if (!dataUrl) throw new Error("nothing to copy");
      const blob = dataUrlToBlob(dataUrl);
      await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
      flashExportStatus("Copied — paste into Excel, Slides, docs…");
    } catch {
      flashExportStatus("Copy blocked here");
    }
  });

  const app = new App(
    { name: "chart-view", version: "1.0.0" },
    { tools: {} },
  );

  // Fires repeatedly while the model is still writing the arguments. This is
  // where the live drawing happens — before the tool has even executed.
  app.ontoolinputpartial = ({ arguments: args }) => draw(args);

  // Fires once the arguments are complete but execution has not returned.
  app.ontoolinput = ({ arguments: args }) => draw(args);

  // Fires with the server's validated result. Authoritative — overwrite.
  app.ontoolresult = (result) => {
    if (result?.structuredContent) draw(result.structuredContent);
  };

  window.addEventListener("resize", () => cells.forEach(({ inst }) => inst.resize()));

  await app.connect();
  app.setupSizeChangedNotifications();
</script>
